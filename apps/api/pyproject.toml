[project]
name = "music-tutor-api"
version = "0.1.0"
description = "Backend do music-tutor: API do app e geração e validação de aulas de teoria musical"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "music21>=9.1",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "markdown>=3.6",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_tutor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
