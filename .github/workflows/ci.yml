name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Testes
        run: pytest -q
      - name: Validar as aulas de exemplo
        run: |
          for aula in ../../aulas-exemplo/*.json; do
            python -m music_tutor validar "$aula"
          done
      - name: Conferir se o HTML de exemplo está atualizado
        run: |
          for aula in ../../aulas-exemplo/*.json; do
            python -m music_tutor renderizar "$aula" -o "${aula%.json}.html"
          done
          git diff --exit-code -- ../../aulas-exemplo
