name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Testes (inclui API e RLS no Postgres)
        run: pytest -q
      - name: Validar as aulas de exemplo
        run: |
          for aula in ../../aulas-exemplo/*.json; do
            python -m music_tutor validar "$aula"
          done
      - name: Conferir se o HTML de exemplo está atualizado
        run: |
          for aula in ../../aulas-exemplo/*.json; do
            python -m music_tutor renderizar "$aula" -o "${aula%.json}.html"
          done
          git diff --exit-code -- ../../aulas-exemplo

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
